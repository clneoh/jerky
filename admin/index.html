<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#a34a26">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Munchies Furkidz · Backoffice</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/print.css" media="print">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="../images/favicon-dog.svg">
</head>
<body>
  <header id="topbar" class="topbar">
    <h1 id="view-title"><span class="logo" aria-hidden="true">🐾</span><span id="view-title-text">Munchies Furkidz</span></h1>
    <span id="view-sub" class="topbar-sub"></span>
  </header>

  <div id="share-warn" class="share-warn" hidden></div>

  <main id="view" class="view" tabindex="-1"></main>

  <nav id="tabbar" class="tabbar" aria-label="Main navigation">
    <a href="#/dashboard" data-tab="dashboard" class="tab"><span class="tab-ico" aria-hidden="true">🏠</span>Home</a>
    <a href="#/orders" data-tab="orders" class="tab"><span class="tab-ico" aria-hidden="true">📋</span>Orders<span id="orders-badge" class="tab-badge" hidden></span></a>
    <a href="#/products" data-tab="products" class="tab"><span class="tab-ico" aria-hidden="true">🦴</span>Products</a>
    <a href="#/customers" data-tab="customers" class="tab"><span class="tab-ico" aria-hidden="true">🐾</span>Customers</a>
    <a href="#/more" data-tab="more" class="tab"><span class="tab-ico" aria-hidden="true">⋯</span>More</a>
  </nav>

  <div id="confirm-layer" class="confirm-layer" hidden></div>
  <div id="popup-layer" class="popup-layer" hidden></div>
  <div id="lock-layer" class="lock-layer" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
