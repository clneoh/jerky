<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Promo card · Munchies Furkidz</title>
<style>
:root{--ink:#2b1d14;--terra:#7c3a2d;--muted:#8a7664;--rule:#ded6cd;}
*{box-sizing:border-box}
body{margin:0;background:#efe9e2;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}

/* The bar on screen only. A card is a printed object; nothing here belongs on
   the paper, so every pixel of it is no-print. */
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:12px 16px;
  background:#fff;border-bottom:1px solid var(--rule)}
.bar .btn{font:600 14px/1 inherit;padding:11px 18px;border-radius:10px;border:1px solid var(--terra);
  background:var(--terra);color:#fff;cursor:pointer}
.bar .hint{margin:0;font-size:12.5px;color:var(--muted);max-width:44ch}
/* Nothing to print, so nothing to press. Needed as a rule of its own because the
   bar is display:flex, which outranks the browser's own [hidden] style. */
.bar.is-off{display:none}

/* FOUR A6 CARDS ON ONE A4 SHEET. Two columns of 105mm is exactly 210mm and two
   rows of 148mm is 296mm of 297mm — the whole page, four identical cards to one
   press. 1fr rows inside a fixed-height sheet rather than fixed heights, so a
   rounding error can never spill a blank second sheet. */
#card{padding:16px 16px 28px;overflow-x:auto}
.sheet{width:210mm;height:297mm;margin:0 auto;background:#fff;overflow:hidden;
  display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr);
  box-shadow:0 1px 8px rgba(43,29,20,.18)}
.card6{border:1px dashed #d9d1c7;padding:8mm 7.5mm;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center}

.c-brand{margin:0;font-size:12pt;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--terra)}
.c-tag{margin:1mm 0 0;font-size:7.5pt;color:var(--muted)}
.c-mid{display:flex;flex-direction:column;gap:1.6mm;align-items:center}
.c-offer{margin:0;font-size:17pt;font-weight:700;line-height:1.12}
.c-min{margin:0;font-size:9pt;color:var(--muted)}
.c-say{margin:0;font-size:8pt;font-style:italic;color:var(--terra);max-width:64mm}
.c-rules{margin:0;font-size:7.5pt;color:var(--muted)}
.c-code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:23pt;font-weight:700;letter-spacing:.18em;padding-left:.18em;color:var(--ink)}
.c-qr{width:34mm;height:34mm}
.c-qr svg{display:block;width:100%;height:100%}
.c-where{margin:0;font-size:7pt;color:var(--muted);max-width:60mm}

.notice{max-width:56ch;margin:24px auto;padding:18px 20px;background:#fff;border-radius:12px;
  border:1px solid var(--rule);font-size:14px;line-height:1.5}
.notice .hint{margin:10px 0 0;font-size:12.5px;color:var(--muted)}

@page{size:A4;margin:0}
@media print{
  body{background:#fff}
  .no-print{display:none!important}
  #card{padding:0;overflow:visible}
  .sheet{box-shadow:none;margin:0}
  .card6{border-color:#e8e2da}
  .c-qr svg{shape-rendering:crispEdges}
}
</style>
</head>
<body>
  <div class="bar no-print">
    <button id="print-btn" class="btn" type="button">Print this card</button>
    <p class="hint">
      Four cards to a sheet of A4 — cut along the hairlines. Best printed from a
      computer. Nothing is frozen until you press Print it on the code's row in the
      app; this page only draws what that press already decided.
    </p>
  </div>
  <main id="card"></main>

  <script type="module">
    import { boot } from "./js/promo-card.js";
    boot();
  </script>
</body>
</html>
